name: eduops360-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: eduops360
      POSTGRES_USER: eduops_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in infra/.env}
      EDUOPS_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in infra/.env}
      EDUOPS_AUDIT_WORKER_PASSWORD: ${POSTGRES_AUDIT_WORKER_PASSWORD:?Set POSTGRES_AUDIT_WORKER_PASSWORD in infra/.env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eduops_migrator -d eduops360"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: ../backend
    environment:
      EDUOPS_ENVIRONMENT: local
      EDUOPS_DATABASE_URL: postgresql+psycopg://eduops_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in infra/.env}@db:5432/eduops360
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    environment:
      EDUOPS_ENVIRONMENT: local
      EDUOPS_DATABASE_URL: postgresql+psycopg://eduops_runtime:${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in infra/.env}@db:5432/eduops360
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=6)"]
      interval: 5s
      timeout: 7s
      retries: 15
      start_period: 5s

  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
