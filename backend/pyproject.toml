[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "eduops360-backend"
version = "0.1.0"
description = "EduOps 360 local application foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.8",
  "psycopg[binary]==3.3.8",
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.2.0",
  "anyio==4.16.0",
]

[project.optional-dependencies]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

